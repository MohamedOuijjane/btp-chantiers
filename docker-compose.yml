name: btp-chantiers

x-restart: &restart
  restart: unless-stopped

services:
  # ---------- Base de données unique ----------
  # Une seule base "btp_db" (exigence du projet), un schéma et un utilisateur par module :
  # chaque module reste propriétaire de ses tables (voir docs/adr/0005-base-de-donnees-unique.md).
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_DB: btp_db
      POSTGRES_USER: ${POSTGRES_USER:-btp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-btp}
      CHANTIERS_DB_PASSWORD: ${CHANTIERS_DB_PASSWORD:-chantiers}
      TACHES_DB_PASSWORD: ${TACHES_DB_PASSWORD:-taches}
      OUVRIERS_DB_PASSWORD: ${OUVRIERS_DB_PASSWORD:-ouvriers}
      MATERIAUX_DB_PASSWORD: ${MATERIAUX_DB_PASSWORD:-materiaux}
    ports: ["5432:5432"]   # accès avec DBeaver / pgAdmin en dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btp} -d btp_db"]
      interval: 5s
      retries: 10
    networks: [data]

  # TEMPORAIRE : supprimé quand Tâches sera migré vers PostgreSQL (issue Houssam)
  mongo:
    image: mongo:7
    <<: *restart
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10
    networks: [data]

  # TEMPORAIRE : supprimé quand Matériaux sera migré vers PostgreSQL (issue Hatim)
  mysql:
    image: mysql:8.4
    <<: *restart
    environment:
      MYSQL_DATABASE: materiaux_db
      MYSQL_USER: ${MYSQL_USER:-btp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-btp}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
    networks: [data]

  # ---------- Modules métier ----------
  chantiers-service:
    build: ./services/chantiers-service
    <<: *restart
    ports: ["8081:8081"]   # accès direct en dev
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/btp_db?currentSchema=chantiers
      DB_USER: chantiers_user
      DB_PASSWORD: ${CHANTIERS_DB_PASSWORD:-chantiers}
      TACHES_URL: http://taches-service:8082
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data, backend]

  taches-service:
    build: ./services/taches-service
    <<: *restart
    ports: ["8082:8082"]   # accès direct en dev
    environment:
      MONGO_URL: mongodb://mongo:27017/taches_db
      CHANTIERS_URL: http://chantiers-service:8081
      OUVRIERS_URL: http://ouvriers-service:8083
      MATERIAUX_URL: http://materiaux-service:8084
    depends_on:
      mongo: { condition: service_healthy }
    networks: [data, backend]

  ouvriers-service:
    build: ./services/ouvriers-service
    <<: *restart
    ports: ["8083:8083"]   # accès direct en dev
    environment:
      DATABASE_URL: postgresql+psycopg://ouvriers_user:${OUVRIERS_DB_PASSWORD:-ouvriers}@postgres:5432/btp_db
      TACHES_URL: http://taches-service:8082
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data, backend]

  materiaux-service:
    build: ./services/materiaux-service
    <<: *restart
    ports: ["8084:8084"]   # accès direct en dev
    environment:
      DB_URL: jdbc:mysql://mysql:3306/materiaux_db
      DB_USER: ${MYSQL_USER:-btp}
      DB_PASSWORD: ${MYSQL_PASSWORD:-btp}
      CHANTIERS_URL: http://chantiers-service:8081
    depends_on:
      mysql: { condition: service_healthy }
    networks: [data, backend]

  # ---------- Interface web ----------
  frontend:
    build: ./frontend
    <<: *restart
    networks: [backend]   # pas de port publié : accès via la gateway

  # ---------- Point d'entrée unique ----------
  gateway:
    image: nginx:1.27-alpine
    <<: *restart
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [frontend, chantiers-service, taches-service, ouvriers-service, materiaux-service]
    networks: [backend]

networks:
  data:      # services <-> bases de données
  backend:   # services <-> services et gateway

volumes:
  postgres-data:
  mongo-data:
  mysql-data:
