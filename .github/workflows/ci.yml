name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chantiers:
    name: Chantiers (Spring Boot)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/chantiers-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Tests, couverture (JaCoCo), Checkstyle et SpotBugs
        run: mvn -B verify
      - name: Résumé qualité
        if: always()
        run: |
          [ -f target/site/jacoco/jacoco.csv ] || exit 0
          {
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Chantiers : %.1f %% des lignes couvertes\n", 100*c/(m+c)}' target/site/jacoco/jacoco.csv
            echo "Checkstyle : $(grep -o '<error ' target/checkstyle-result.xml | wc -l) avertissement(s) · SpotBugs : $(grep -o '<BugInstance ' target/spotbugsXml.xml | wc -l) bug(s)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-chantiers
          path: |
            services/chantiers-service/target/site/jacoco/jacoco.xml
            services/chantiers-service/target/checkstyle-result.xml
            services/chantiers-service/target/spotbugsXml.xml
            services/chantiers-service/target/classes/
          if-no-files-found: warn

  materiaux:
    name: Matériaux (Spring-WS SOAP)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/materiaux-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Tests, couverture (JaCoCo), Checkstyle et SpotBugs
        run: mvn -B verify
      - name: Résumé qualité
        if: always()
        run: |
          [ -f target/site/jacoco/jacoco.csv ] || exit 0
          {
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Matériaux : %.1f %% des lignes couvertes\n", 100*c/(m+c)}' target/site/jacoco/jacoco.csv
            echo "Checkstyle : $(grep -o '<error ' target/checkstyle-result.xml | wc -l) avertissement(s) · SpotBugs : $(grep -o '<BugInstance ' target/spotbugsXml.xml | wc -l) bug(s)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-materiaux
          path: |
            services/materiaux-service/target/site/jacoco/jacoco.xml
            services/materiaux-service/target/checkstyle-result.xml
            services/materiaux-service/target/spotbugsXml.xml
            services/materiaux-service/target/classes/
          if-no-files-found: warn

  taches:
    name: Tâches (NestJS)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/taches-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: services/taches-service/package-lock.json }
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests et couverture
        run: npm run test:cov
      - run: npm run build
      - name: Résumé qualité
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e "const t = require('./coverage/coverage-summary.json').total; console.log('### Tâches : ' + t.lines.pct + ' % des lignes couvertes')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-taches
          path: services/taches-service/coverage/lcov.info
          if-no-files-found: warn

  ouvriers:
    name: Ouvriers (FastAPI)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ouvriers-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Tests et couverture
        run: pytest -q --cov=app --cov-report=xml --cov-report=term
      - name: Résumé qualité
        if: always()
        run: |
          [ -f .coverage ] || exit 0
          { echo "### Ouvriers"; coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-ouvriers
          path: services/ouvriers-service/coverage.xml
          if-no-files-found: warn

  sonarcloud:
    name: SonarCloud
    needs: [chantiers, materiaux, taches, ouvriers]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Analyse ignorée (secret SONAR_TOKEN absent)
        if: env.SONAR_TOKEN == ''
        run: |
          echo "### SonarCloud ignoré : secret SONAR_TOKEN absent (PR depuis un fork ou Dependabot)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with: { name: rapports-chantiers, path: services/chantiers-service/target }
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with: { name: rapports-materiaux, path: services/materiaux-service/target }
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with: { name: rapports-taches, path: services/taches-service/coverage }
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with: { name: rapports-ouvriers, path: services/ouvriers-service }
      - name: Analyse SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  frontend:
    name: Front-end (React)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Build des images Docker
    needs: [chantiers, materiaux, taches, ouvriers, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # JWT_SECRET et DEMO_MOT_DE_PASSE sont obligatoires dans docker-compose.yml (ADR-0006).
      - name: Variables d'environnement de démonstration
        run: cp .env.example .env
      - run: docker compose build
