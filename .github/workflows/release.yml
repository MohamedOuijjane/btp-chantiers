name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [chantiers, taches, ouvriers, materiaux]
    env:
      IMAGE: ghcr.io/mohamedouijjane/btp-${{ matrix.service }}
      TRIVY_VERSION: 0.56.2
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: echo "valeur=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}-service
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.valeur }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.valeur }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan Trivy (échec si vulnérabilité CRITICAL corrigeable)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" "aquasec/trivy:${TRIVY_VERSION}" image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            --ignorefile /.trivyignore \
            "${IMAGE}:${{ steps.version.outputs.valeur }}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: docker push --all-tags "$IMAGE"

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Créer la release avec les notes générées
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          options=(--repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag --title "$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in *-*) options+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${options[@]}"
