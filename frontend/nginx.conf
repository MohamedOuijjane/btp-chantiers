# Front-end BTP Chantiers : application React (SPA) servie derrière la gateway.
server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Fichiers versionnés par Vite (nom avec empreinte) : cache long.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Sonde du healthcheck Docker.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Routes React (/chantiers/12…) : on renvoie index.html, jamais mis en cache.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
