<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BTP Chantiers : pilotage des chantiers, des ouvriers et des matériaux."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap"
    />
    <title>BTP Chantiers</title>
    <script>
      // Applique le thème avant le premier affichage (évite un flash clair en mode sombre).
      try {
        var t = localStorage.getItem('btp-theme');
        var sombre = t ? t === 'sombre' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (sombre) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
