# API Gateway : point d'entrée unique de l'application (http://localhost:8080)
# Authentification (ADR-0006) : toute requête vers /api/* et /ws est d'abord vérifiée par
# Chantiers (GET /api/auth/verifier, sous-requête auth_request), sauf la connexion, le WSDL et /health.
events {}

http {
  resolver 127.0.0.11 valid=10s;   # DNS interne Docker

  # Identifiant de requête : celui envoyé par le front (src/api/http.ts) s'il est bien formé
  # (8 à 64 caractères alphanumériques ou tirets), sinon un identifiant généré par nginx.
  # Le même id est transmis au service, renvoyé au client (bandeau d'erreur) et écrit dans les logs.
  map $http_x_request_id $id_requete {
    "~^[A-Za-z0-9-]{8,64}$" $http_x_request_id;
    default                 $request_id;
  }

  proxy_set_header Host $http_host;
  proxy_set_header X-Request-Id $id_requete;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # Utilisateur authentifié, renseigné par auth_request_set dans les locations protégées.
  # Toujours écrasés : une valeur envoyée par le client n'atteint jamais les services
  # (un en-tête vide n'est pas transmis).
  proxy_set_header X-Utilisateur $utilisateur;
  proxy_set_header X-Role $role;
  add_header X-Request-Id $id_requete always;

  log_format main '$remote_addr "$request" $status $request_time s req_id=$id_requete user=$utilisateur';
  access_log /dev/stdout main;

  server {
    listen 8080;

    # Valeurs par défaut (routes publiques) ; remplacées par auth_request_set ci-dessous.
    set $utilisateur "";
    set $role "";

    # ---------- Vérification du jeton (sous-requête interne) ----------
    location = /_verifier-jeton {
      internal;
      # Variable propre à la sous-requête : les variables nginx sont partagées avec la requête
      # principale, un « set $u » ici changerait la destination de celle-ci.
      set $u_verifier http://chantiers-service:8081/api/auth/verifier;
      proxy_pass $u_verifier;
      # La sous-requête reprendrait sinon la méthode d'origine (POST /ws, PUT…) : toujours GET.
      proxy_method GET;
      proxy_pass_request_body off;
      # Un proxy_set_header ici remplace ceux du bloc http : on redonne ceux qui servent.
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Request-Id $id_requete;
      proxy_set_header X-Original-URI $request_uri;
      proxy_connect_timeout 2s;
      proxy_read_timeout 2s;
    }

    # 401 de auth_request : JSON au format RFC 9457 (le front le convertit en ApiError).
    # L'en-tête WWW-Authenticate: Bearer est repris tel quel de la réponse de Chantiers.
    location @non_authentifie {
      default_type application/problem+json;
      add_header X-Request-Id $id_requete always;
      return 401 '{"type":"about:blank","title":"Unauthorized","status":401,"detail":"Authentification requise : jeton absent, invalide ou expiré."}';
    }

    # Chantiers injoignable pendant la vérification : auth_request renvoie 500, on répond 503.
    location @authentification_indisponible {
      default_type application/problem+json;
      add_header X-Request-Id $id_requete always;
      return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"Le service d’authentification est indisponible, réessayez dans un instant."}';
    }

    # ---------- Routes publiques ----------
    location = /api/auth/login { set $u http://chantiers-service:8081; proxy_pass $u; }
    location = /ws/materiaux.wsdl { set $u http://materiaux-service:8084; proxy_pass $u; }
    location = /health { return 200 '{"status":"UP","service":"gateway"}'; default_type application/json; }
    location /              { set $u http://frontend:80; proxy_pass $u; }

    # ---------- Routes protégées ----------
    location /api/auth/ {
      auth_request /_verifier-jeton;
      auth_request_set $utilisateur $upstream_http_x_utilisateur;
      auth_request_set $role $upstream_http_x_role;
      error_page 401 = @non_authentifie;
      error_page 500 = @authentification_indisponible;
      set $u http://chantiers-service:8081;
      proxy_pass $u;
    }
    location /api/chantiers {
      auth_request /_verifier-jeton;
      auth_request_set $utilisateur $upstream_http_x_utilisateur;
      auth_request_set $role $upstream_http_x_role;
      error_page 401 = @non_authentifie;
      error_page 500 = @authentification_indisponible;
      set $u http://chantiers-service:8081;
      proxy_pass $u;
    }
    location /api/taches {
      auth_request /_verifier-jeton;
      auth_request_set $utilisateur $upstream_http_x_utilisateur;
      auth_request_set $role $upstream_http_x_role;
      error_page 401 = @non_authentifie;
      error_page 500 = @authentification_indisponible;
      set $u http://taches-service:8082;
      proxy_pass $u;
    }
    location /api/ouvriers {
      auth_request /_verifier-jeton;
      auth_request_set $utilisateur $upstream_http_x_utilisateur;
      auth_request_set $role $upstream_http_x_role;
      error_page 401 = @non_authentifie;
      error_page 500 = @authentification_indisponible;
      set $u http://ouvriers-service:8083;
      proxy_pass $u;
    }
    location /ws {
      auth_request /_verifier-jeton;
      auth_request_set $utilisateur $upstream_http_x_utilisateur;
      auth_request_set $role $upstream_http_x_role;
      error_page 401 = @non_authentifie;
      error_page 500 = @authentification_indisponible;
      set $u http://materiaux-service:8084;
      proxy_pass $u;
    }
  }
}
