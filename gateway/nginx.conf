# API Gateway : point d'entrée unique de l'application (http://localhost:8080)
events {}

http {
  resolver 127.0.0.11 valid=10s;   # DNS interne Docker
  proxy_set_header Host $host;
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  add_header X-Request-Id $request_id always;

  log_format main '$remote_addr "$request" $status $request_time s req_id=$request_id';
  access_log /dev/stdout main;

  server {
    listen 8080;

    location /api/chantiers { set $u http://chantiers-service:8081; proxy_pass $u; }
    location /api/taches    { set $u http://taches-service:8082;    proxy_pass $u; }
    location /api/ouvriers  { set $u http://ouvriers-service:8083;  proxy_pass $u; }
    location /ws            { set $u http://materiaux-service:8084; proxy_pass $u; }

    location = /health { return 200 '{"status":"UP","service":"gateway"}'; default_type application/json; }
  }
}
