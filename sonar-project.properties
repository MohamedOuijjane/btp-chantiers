# Analyse SonarCloud (job « SonarCloud » de .github/workflows/ci.yml)
sonar.organization=mohamedouijjane
sonar.projectKey=MohamedOuijjane_btp-chantiers
sonar.projectName=BTP Chantiers
sonar.sourceEncoding=UTF-8

sonar.modules=chantiers,materiaux,taches,ouvriers

# ---------- Chantiers (Java, Spring Boot) ----------
chantiers.sonar.projectName=Chantiers
chantiers.sonar.projectBaseDir=services/chantiers-service
chantiers.sonar.sources=src/main/java
chantiers.sonar.tests=src/test/java
chantiers.sonar.java.binaries=target/classes
chantiers.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
chantiers.sonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
chantiers.sonar.java.spotbugs.reportPaths=target/spotbugsXml.xml

# ---------- Matériaux (Java, Spring-WS SOAP) ----------
materiaux.sonar.projectName=Matériaux
materiaux.sonar.projectBaseDir=services/materiaux-service
materiaux.sonar.sources=src/main/java,src/main/resources/xsd
materiaux.sonar.tests=src/test/java
materiaux.sonar.java.binaries=target/classes
materiaux.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
materiaux.sonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
materiaux.sonar.java.spotbugs.reportPaths=target/spotbugsXml.xml

# ---------- Tâches (TypeScript, NestJS) ----------
taches.sonar.projectName=Tâches
taches.sonar.projectBaseDir=services/taches-service
taches.sonar.sources=src
taches.sonar.tests=test
taches.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ---------- Ouvriers (Python, FastAPI) ----------
ouvriers.sonar.projectName=Ouvriers
ouvriers.sonar.projectBaseDir=services/ouvriers-service
ouvriers.sonar.sources=app
ouvriers.sonar.tests=tests
ouvriers.sonar.python.version=3.12
ouvriers.sonar.python.coverage.reportPaths=coverage.xml
