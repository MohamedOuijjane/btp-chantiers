server:
  port: ${PORT:8084}

spring:
  application:
    name: materiaux-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/btp_db?currentSchema=materiaux}
    username: ${DB_USER:materiaux_user}
    password: ${DB_PASSWORD:materiaux}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

services:
  chantiers:
    url: ${CHANTIERS_URL:http://localhost:8081}
  timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info
