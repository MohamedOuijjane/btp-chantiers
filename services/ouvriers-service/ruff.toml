# Analyse statique du module Ouvriers (ruff check)
target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "B", "UP"]

[lint.per-file-ignores]
# Les tests fixent DATABASE_URL avant d'importer l'application
"tests/*" = ["E402"]

[lint.flake8-bugbear]
# Depends() et Query() en valeur par défaut : usage normal de FastAPI
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
